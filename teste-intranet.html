<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste Intranet</title>
<style>
  body { font-family: "Segoe UI", sans-serif; background: #f5f6f8; color: #1d2433; margin: 0; padding: 40px 16px; }
  main { max-width: 560px; margin: auto; background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  h1 { color: #2f5bd3; font-size: 22px; margin-top: 0; }
  dt { font-weight: 600; margin-top: 12px; }
  dd { margin: 4px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Teste de anexo HTML: funcionou</h1>
  <p>Se esta página aparece formatada, o navegador abriu o arquivo e executou o script abaixo.</p>
  <dl>
    <dt>Aberto via</dt><dd id="via">script bloqueado</dd>
    <dt>Endereço</dt><dd id="url">-</dd>
    <dt>Navegador</dt><dd id="ua">-</dd>
  </dl>
</main>
<script>
  const p = location.protocol;
  document.getElementById('via').textContent =
    p === 'file:' ? 'arquivo local (baixado e aberto)' : 'direto da Intranet (' + p + ')';
  document.getElementById('url').textContent = location.href;
  document.getElementById('ua').textContent = navigator.userAgent;
</script>
</body>
</html>
