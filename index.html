<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard de Compras</title>
  <script>
    // Tema antes do primeiro desenho (evita piscar): escolha salva, senão o do sistema.
    try {
      var t = localStorage.getItem('dashboard-compras:tema');
      document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/componentes.css">
  <link rel="stylesheet" href="./src/styles/impressao.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo">
    <div class="topo-marca">
      <h1>Dashboard de Compras</h1>
      <span id="periodo" class="selo" hidden></span>
    </div>
    <nav id="abas" class="abas" role="tablist" aria-label="Telas"></nav>
    <div class="topo-acoes">
      <button type="button" id="acao-importar" class="botao">Atualizar bases</button>
      <button type="button" id="acao-painel" class="botao botao-sec" disabled title="Baixa o painel-compras.html para publicar no SharePoint">Gerar painel</button>
      <button type="button" id="acao-config" class="botao botao-sec">Configuração</button>
      <button type="button" id="acao-imprimir" class="botao botao-sec">Imprimir</button>
      <button type="button" id="acao-tema" class="botao botao-sec" aria-pressed="false">Tema escuro</button>
    </div>
  </header>
  <div id="filtros" class="faixa-filtros" hidden></div>
  <p id="filtros-impressao" class="so-impressao"></p>
  <main id="conteudo" class="pagina" role="tabpanel" tabindex="-1"></main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
